version: 2
updates:
  - package-ecosystem: 'gomod' # See documentation for possible values
    directory: / # Location of package manifests
    schedule:
      interval: 'weekly'
    groups:
      go:
        patterns:
          - 'github.com*'
          - 'golang.org*'
    assignees:
      - 'algo7'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    assignees:
      - 'algo7'
